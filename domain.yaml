# What these plans have verified about Duffel's API in test mode. Each concept names the plans
# that prove it; nothing here is copied from the docs without a run behind it.
concepts:
  authentication:
    description: >-
      Every call carries "Authorization: Bearer <token>" and "Duffel-Version: v2". A test token
      starts with duffel_test_ and reaches only test-mode resources. The environments read it from
      DUFFEL_ACCESS_TOKEN, the variable Duffel's own client libraries use.
    applies_to: [error]
    constraint: send Duffel-Version on every request, not only on writes

  envelopes:
    description: >-
      A single resource comes back as {"data": {...}} and a list as {"data": [...], "meta": {...}},
      except place suggestions, whose list has no meta. Errors come back as {"errors": [{type,
      title, message, code}], "meta": {request_id, status}}; branch on code, which is stable.
    applies_to: [error]

  pagination:
    description: >-
      Lists page with cursors. limit takes 1 to 200 and after takes the previous page's meta.after,
      an opaque string that is null on the last page. The reference lists (airports, cities,
      airlines, aircraft, loyalty programmes) come in name order. Proven by
      plans/reference/airports-and-cities.yaml.
    applies_to: [limit, after, nextCursor, pageSize]
    constraint: pass nextCursor back as after; never build a cursor

  rateLimits:
    description: >-
      Every response reports the token's budget in lowercase headers: ratelimit-limit (4000 a
      minute), ratelimit-remaining, and ratelimit-reset, an HTTP date at the end of the current
      minute. Each also carries x-request-id, the ID to quote to Duffel support. Searches (POST
      /air/offer_requests) have a budget of their own, 30 a minute, and past it Duffel answers 429
      rate_limit_exceeded (a rate_limit_error) until ratelimit-reset. Find Offer and Book Flight
      retry a refused search, which waits for that reset.
    applies_to: [rateLimitLimit, rateLimitRemaining]

  places:
    description: >-
      Place suggestions mix airports (arp_, type airport) and cities (cit_, type city). An airport
      carries its city under city, and a city lists its airports; Heathrow is airport LHR in city
      LON. A search by point takes lat, lng, and rad in metres. A query that matches nothing is 200
      with an empty list, not 404. Proven by plans/reference/places.yaml.
    applies_to: [query, lat, lng, rad, places, firstAirportCode, cityCodes]
    constraint: take the airport code from an element whose type is airport

  searchSize:
    description: >-
      A search can return hundreds of offers from many airlines (229 for one adult from LHR to JFK,
      1.5 MB with return_offers=true). The plans search with return_offers=false and page the offers
      with listOffers, cheapest first, or use a batch search, whose offers arrive a supplier at a time.
      Proven by plans/search/one-way.yaml and plans/search/batch.yaml.
    applies_to: [offerRequestId, offers, pageSize]
    constraint: don't inline offers in the search response; page them

  duffelAirways:
    description: >-
      In test mode the searches return offers from many airline sandboxes, but only Duffel Airways,
      owner ZZ, books reliably, so every plan picks the offer whose ownerCode is ZZ. A Duffel Airways
      offer can always be held (payment due about three days later). Whether it allows a change or a
      refund before departure varies from search to search: twelve Basic fares from LHR to JFK showed all
      four combinations. An allowed one states a 40.00 penalty, and a refused one has no penalty, so read
      change_before_departure and refund_before_departure rather than assume them. It includes a checked
      and a carry-on bag, sells one extra 23 kg bag at 20.00, and has an
      economy seat map of 192 seats with 76 for sale at 20.00. It sells no upsell offers (422
      unsupported_action). Proven by the plans under plans/search/.
    applies_to: [ownerCode, offerId, services, seats]
    constraint: select the offer whose ownerCode is ZZ, never the first or the cheapest

  offerLifetime:
    description: >-
      An offer expires about 30 minutes after its search, and reading one that is gone is 422
      offer_no_longer_available. Its passenger IDs are the pas_ IDs of the offer request, and an order
      names them. The price can move after the search; read the offer or price it before paying.
    applies_to: [offerId, passengers, expiresAt, totalAmount]

  batchSearch:
    description: >-
      A batch search starts with total_batches equal to remaining_batches. Each read of it returns only
      the offers of the batches that arrived since the last read, and remaining_batches falls unevenly
      (6, 2, 1, 0 in one run); Duffel Airways arrives in the first. The search expires a minute after it
      starts. Proven by plans/search/batch.yaml, which repeats the read and collects the offers.
    applies_to: [batchOfferRequestId, remainingBatches, zzOffers]
    constraint: repeat the read until remainingBatches is 0, collecting offers from every read

  loyaltyAccounts:
    description: >-
      A passenger's loyalty programme accounts are attached to the offer before booking, with PATCH on
      the offer's passenger. Duffel's test account (Amelia Earhart, airline ZZ, number 1234567890) takes
      10% off a Duffel Airways offer: 229.05 became 206.15. An order booked afterwards is priced at the
      member price and keeps the account. Proven by plans/search/loyalty.yaml and
      plans/booking/loyalty-member.yaml.
    applies_to: [passengerId, loyaltyAccountNumber]

  testRoutes:
    description: >-
      Duffel's test mode simulates situations on fixed one-way routes: PVD to RAI has no offers, JFK to
      EWR only holdable ones, LHR to DXB connecting flights, DXB to AMS a stop within a flight, BTS to MRU
      no baggage, BTS to ABV no extra services, STN to LHR a search timeout (504
      gateway_timeout_error), LGW to LHR an offer gone by the time it's read (422
      offer_no_longer_available), and LHR to STN a price that rises 10.00 with every read. On the
      order side, LHR to LGW fails the order with 502 airline_unknown (an airline_error), LGW to STN
      refuses a balance payment with 422 insufficient_balance (an invalid_state_error), and an order
      paid at LHR to STN's earlier price is refused with 422 payment_amount_does_not_match_order_amount
      (a validation_error). None of the refused orders exists afterwards. Proven by the plans under
      plans/scenarios/. After booking, LHR to LTN gives an order airline-initiated changes, and LTN to SYD
      refunds a cancellation as airline credits; proven by plans/after-booking/airline-initiated-change.yaml
      and plans/after-booking/cancel-to-airline-credits.yaml.
    applies_to: [origin, destination]

  orders:
    description: >-
      POST /air/orders books an offer and answers 201 in about half a second. Each passenger is named
      with the offer's pas_ ID, a title, gender, given and family names, a birth date, an email, and a
      phone number, and the birth date must fit the age searched as of the last slice's departure.
      An infant is booked by naming its pas_ ID as infant_passenger_id on one adult; the order's
      passengers echo neither that link nor a passenger type. "services": [] is accepted. An order
      stores the metadata it is booked with, and PATCH replaces the metadata, the only thing an order
      update changes. The list filters booking_reference and offer_id find exactly the order. Proven by
      the plans under plans/booking/.
    applies_to: [orderId, bookingPassengers, infantCarers, bookingReference, metadataSource, metadataReference]
    constraint: send amount and currency exactly as the price action returns them, services included

  holdsAndPayments:
    description: >-
      An instant order pays from the balance at exactly the priced total. A hold order sends no payment:
      it is awaiting payment, due 72 hours after the offer request was created, with its price
      guaranteed for 48 hours, and seats and bags can be held with it. POST /air/payments at the held
      total pays it (status succeeded, type balance), after which the order is no longer awaiting
      payment and its total is unchanged; GET /air/payments?order_id= lists the one payment. A payment's
      type must be balance or card: an airline credit is refused with 422 validation_inclusion. Proven by
      plans/booking/hold-couple.yaml, plans/booking/hold-then-pay-trio-seats.yaml, and
      plans/after-booking/airline-credits.yaml.
    applies_to: [orderType, awaitingPayment, paymentRequiredBy, priceGuaranteeExpiresAt, paymentId, paymentType]

  servicesAtBooking:
    description: >-
      Seats and extra bags are priced with the offer and bought with the order. The price action echoes
      intended_services, and the order books exactly those, adding 20.00 for each Duffel Airways seat
      and each extra 23 kg bag. An infant on an adult's lap takes no seat. Proven by
      plans/booking/instant-family-seats-bags.yaml.
    applies_to: [seatServices, bagServices, intendedServices, seatCount, bagCount]

  cleanupAndGuard:
    description: >-
      Every order the plans book carries metadata.source "aat-duffel" and is cancelled in cleanup: a
      cancellation quote, then its confirmation. plans/zz-no-live-orders.yaml reads every page of the
      account's orders and fails when one of the package's orders is still active; orders from other
      sources are counted apart. When the package was built the account held 267 orders from earlier
      projects, none of them active. A plan that quotes or confirms the cancellation itself releases the
      matching cleanup entry, and a quote left unconfirmed is confirmed by its own cleanup
      (plans/after-booking/cancel-quote-then-cleanup.yaml).
    applies_to: [ourOrderCount, ourActiveOrderCount, otherActiveOrderCount]

  orderChanges:
    description: >-
      A change request replaces one slice of a booked order with a journey on a new date in a requested
      cabin. For a Duffel Airways order from LHR to JFK it offers nine changes: economy, premium economy,
      and first, each at 06:00, 12:00, and 18:00, each costing 125.00 with a 25.00 penalty. Business is
      never offered, even when asked for. Choosing an offer makes a pending change; confirming it pays
      change_total_amount from the balance, after which the order's total is the old total plus exactly
      that amount, the seats and bags on the replaced slice are gone (a round trip keeps the return
      flight's seats), and the order allows only cancel and update. A second change request is 422
      order_not_changeable (an invalid_state_error). Proven by the plans under plans/after-booking/ whose
      names start with change-.
    applies_to: [orderChangeRequestId, changeOffers, orderChangeOfferId, orderChangeId, changeTotalAmount, totalBeforeChanges]
    constraint: >-
      select the change offer by cabin and departure time together and fail on a tie; the nine offers
      cost the same, so the cheapest is not a choice

  cancellations:
    description: >-
      A cancellation is quoted, then confirmed. A paid order's quote refunds the whole total to the
      balance, including what a confirmed change cost; an unpaid hold's refunds 0.00 to awaiting_payment.
      The quote reads back unconfirmed and is the order's one cancellation until it is confirmed.
      Afterwards the order allows only update, and both a second quote and a second confirmation are 422
      already_cancelled (an invalid_state_error). Proven by the plans under plans/after-booking/ whose
      names start with cancel-.
    applies_to: [orderCancellationId, refundAmount, refundTo, cancelledAt]
    constraint: quote an order's cancellation once; a plan that cancels explicitly leaves cleanup nothing to do

  servicesAfterBooking:
    description: >-
      Duffel Airways sells seats and bags only with the order. A booked order, paid or held, lists no
      available services, and adding the checked bag its offer sold is 400 "Unsupported operation" (an
      invalid_request_error whose code is the number 400). Sending a payment with a service for a held
      order is refused first, with 422 pay_later_order_no_payment_for_ancillaries. Proven by
      plans/after-booking/services-after-booking.yaml and plans/after-booking/services-after-hold.yaml.
    applies_to: [serviceId, serviceCount]
    constraint: buy seats and bags when booking

  airlineInitiatedChanges:
    description: >-
      On Duffel's LHR to LTN test route, every read of an order's airline-initiated changes makes Duffel
      Airways move the flight again, an hour later each time in the runs, and the order's slice shows the
      new time at once. A change starts with no action taken and offers accept, cancel, and change. Only
      the latest change can be accepted; an older one is 422 stale_airline_initiated_change_accept. After
      accepting it the order still allows cancel, change, and update, and cancels normally. Proven by
      plans/after-booking/airline-initiated-change.yaml, which reads the list once.
    applies_to: [airlineInitiatedChangeCount, latestAirlineInitiatedChangeId, latestAvailableActions]
    constraint: read the list once, then accept latestAirlineInitiatedChangeId

  airlineCredits:
    description: >-
      A cancellation on Duffel's LTN to SYD test route refunds to airline_credits, and its quote carries
      one credit for the whole total. POST /air/airline_credits records a credit whose code is a 13-digit
      ticket number (letters are 422 validation_format); it reads back unspent, with no order, and appears
      in the account's list. Credits can't be spent through POST /air/payments, and every run that creates
      or refunds one leaves it on the account. Proven by plans/after-booking/cancel-to-airline-credits.yaml
      and plans/after-booking/airline-credits.yaml.
    applies_to: [airlineCreditId, airlineCreditCount, code]

  customerUsers:
    description: >-
      A customer user (icu_) is created with an email and both names, replaced whole with PUT, and found
      with the email filter. A second user with the same email is 422 emails_not_unique (an
      invalid_state_error). Duffel's API reference lists no way to delete a user, so each run that
      creates one leaves it on the account; the plans make each email unique. An order booked with users
      names the user, and GET /air/orders?user_id= finds exactly that order. Proven by
      plans/account/customer-users-and-groups.yaml and plans/account/order-for-customer-user.yaml.
    applies_to: [customerUserId, email, userId, userCount]
    constraint: give each run's user a unique email

  customerUserGroups:
    description: >-
      A group (usg_) takes its members as user_ids, and a member's user shows the group. PATCH renames it,
      DELETE answers 204 with no body, and reading it afterwards is 404 not_found (an
      invalid_request_error). Cleanup deletes every group a plan creates. Proven by
      plans/account/customer-users-and-groups.yaml.
    applies_to: [customerUserGroupId, groupId]

  componentClientKeys:
    description: >-
      POST /identity/component_client_keys issues a three-part JWT for Duffel's UI components with no
      claims, a user, a user and an order, or a user that doesn't exist: the claims are checked only when
      the key is used. The key is a credential, so no output holds it. Proven by
      plans/account/customer-users-and-groups.yaml and plans/account/order-for-customer-user.yaml.
    applies_to: [keyIssued, userId, orderId]

  linksSessions:
    description: >-
      POST /links/sessions answers 201 with only a url on links.duffel.com, its session token in the query
      string. reference, success_url, failure_url, and abandonment_url are required; without them the
      session is 422 with one validation_required error each. The URL books on the account, so no output
      holds it. Proven by plans/account/links-sessions.yaml.
    applies_to: [reference, successUrl, failureUrl, abandonmentUrl, urlIssued]

  webhooks:
    description: >-
      A webhook (end_) is created with a url and events, and its signing secret comes back only then. An
      account holds one per mode: a second is 422 unsafe_unique (a validation_error). PATCH sets active and
      events. With nothing behind the URL, a ping is 422 webhook_client_error, yet Duffel records a
      delivery (del_) of a ping.triggered event (wev_) with the status the URL answered, readable from
      GET /air/webhooks/deliveries and GET /air/webhooks/events/{id}. DELETE answers 204, and updating a
      deleted webhook is 404 not_found. Redelivering the event answered 500 internal_server_error in a
      run. Proven by plans/account/webhooks.yaml.
    applies_to: [webhookId, events, active, deliveryCount, eventId]
    constraint: delete the webhook when done, since another can't be created while it exists

  journeyMatchesSearch:
    description: >-
      A Duffel Airways offer, and the order booked from it, echo the search: the first slice's airports and local
      departure date, the second slice's departure date, how many slices and passengers, and the searched cabin on
      every flight. Find Offer and Book Flight assert it on the offer, and each payment slot on the order as it's
      booked, so a run of plans/matrix/ with any layers proves the layers took effect.
    applies_to: [firstSliceOrigin, firstSliceDestination, firstSliceDepartureDate, secondSliceDepartureDate, cabinClasses]
    constraint: compare cabinClasses, the cabin of every flight, not only the first slice's

  productAccess:
    description: >-
      Which Duffel products a test account reaches depends on what Duffel has enabled for it. On
      the account these plans were built against, cards and 3-D Secure sessions answer 403
      unavailable_feature, Stays and Cars answer 403 with a plain-text body, and Links sessions
      are open. The plans cover what the account reaches.
    applies_to: [error]

types:
  iataCode:
    description: A three-letter IATA code of an airport or a city
    format: string
    validation: "^[A-Z]{3}$"

  duffelId:
    description: >-
      A Duffel identifier: a prefix naming the resource, an underscore, and an opaque body.
      Reference data uses arp_ (airport), cit_ (city), arl_ (airline), arc_ (aircraft), and loy_
      (loyalty programme); searches orq_ (offer request), off_ (offer), pas_ (passenger), sli_
      (slice), and seg_ (segment); orders ord_ (order), ase_ (service), and pay_ (payment); after
      booking ocr_ (change request), oco_ (change offer), oce_ (change), ore_ (cancellation), aic_
      (airline-initiated change), and acd_ (airline credit); the account icu_ (customer user), usg_
      (group), end_ (webhook), wev_ (webhook event), and del_ (delivery).
    format: string
    validation: "^[a-z]{3}_[A-Za-z0-9_]+$"

  cursor:
    description: An opaque pagination cursor from meta.after; "" when there is no next page
    format: string
