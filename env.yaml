# Duffel in test mode. Every environment calls api.duffel.com with the access token in
# DUFFEL_ACCESS_TOKEN, the variable Duffel's own client libraries read. Use a test token
# (duffel_test_...): every search asserts live_mode is false before anything is booked, so a
# live token fails its first search instead of buying a ticket.
#
# `_duffel` holds what the environments share. `test` sets the contact details booked
# passengers carry, and `test-ci` spaces requests out for long batches. Pick one with --env;
# the manifest defaults to test.
shared:
  headers:
    Accept: application/json

environments:
  _duffel:
    notes: Duffel test mode. Export DUFFEL_ACCESS_TOKEN with a duffel_test_ access token.
    vars:
      duffelVersion: v2
      # Webhook plans register this URL. Duffel only needs it to be HTTPS and not an IP
      # address; point it at a receiver you control with --var webhookUrl=... to see deliveries.
      webhookUrl: https://example.com/aat-duffel/webhooks
    apiBaseUrl: https://api.duffel.com
    headers:
      Duffel-Version: ${duffelVersion}
    auth:
      type: bearer
      credentials:
        token:
          source: env
          var: DUFFEL_ACCESS_TOKEN
    values:
      contactEmail: ${contactEmail}
      contactPhone: ${contactPhone}
      webhookUrl: ${webhookUrl}

  # Local runs: contact details from the ranges reserved for fiction.
  test:
    extends: _duffel
    vars:
      contactEmail: aat-duffel@example.com
      contactPhone: "+442079460123"

  # Long batches: the same account, with request starts spaced out. Duffel allows 4000 requests
  # a minute per token, so the pacing is courtesy toward the shared test airlines, not a limit.
  test-ci:
    extends: test
    notes: Paced for long sequential or parallel batches.
    settings:
      minRequestInterval: 250ms
