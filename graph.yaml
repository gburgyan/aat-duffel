version: "1.0.0"
title: Duffel Flights API (test mode)
description: >-
  Duffel's flights API as it behaves in test mode, verified by running every plan in this project
  against api.duffel.com. Every request carries a bearer token and Duffel-Version: v2; request and
  success bodies are wrapped in {"data": ...}, and errors come back as {"errors": [{type, title,
  message, code}], "meta": {request_id, status}}.

nodes:
  # --- Places and reference data ------------------------------------------------------

  suggestPlaces:
    description: >-
      Look up airports and cities by name or near a point (GET /places/suggestions), answering 200
      with a list, empty when nothing matches. Send query for a name or code, or lat, lng, and rad
      (metres) for a point. An airport (arp_, type airport) carries its city under city; a city
      (cit_, type city) lists its airports.
    adapter: suggestPlaces
    tags: [places, reference]
    inputs:
      - name: query
        type: string
        optional: true
        description: A city, airport, or IATA code to match, such as Heathrow or JFK
      - name: lat
        type: float
        optional: true
        description: Latitude of the point to search near; send lng and rad with it
      - name: lng
        type: float
        optional: true
        description: Longitude of the point to search near
      - name: rad
        type: integer
        optional: true
        description: Search radius around the point, in metres
    outputs:
      - name: placeCount
        type: integer
        description: How many airports and cities matched
      - name: places
        type: place[]
        description: The matches in Duffel's order, airports and cities mixed
        elementFields:
          - name: id
            type: string
          - name: type
            type: enum[airport, city]
          - name: iataCode
            type: string
          - name: name
            type: string
          - name: cityId
            type: string
          - name: cityCode
            type: string
          - name: countryCode
            type: string
      - name: airportCodes
        type: string[]
        description: The IATA codes of the matched airports, in order
      - name: cityCodes
        type: string[]
        description: The IATA codes of the matched cities, in order
      - name: firstAirportCode
        type: string
        display: Airport
        description: The first matched airport's IATA code; "" when no airport matched
      - name: firstCityAirportCode
        type: string
        description: The first airport of the first matched city; "" when no city matched
    satisfies: [placeResolved]

  listAirports:
    description: >-
      Page through every airport Duffel knows, in name order (GET /air/airports, 200). Pages use
      cursors: limit is 1 to 200, and after takes the previous page's meta.after, which is null
      on the last page. Every response reports the token's rate limit in ratelimit-* headers.
    adapter: listAirports
    tags: [reference, pagination]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Airports per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor; leave out for the first page
    outputs:
      - name: airports
        type: airport[]
        description: This page's airports
        elementFields:
          - name: id
            type: string
          - name: iataCode
            type: string
          - name: icaoCode
            type: string
          - name: name
            type: string
          - name: cityCode
            type: string
          - name: countryCode
            type: string
          - name: timeZone
            type: string
      - name: pageSize
        type: integer
        description: How many airports this page holds
      - name: nextCursor
        type: string
        description: The cursor for the next page, from meta.after; "" on the last page
      - name: rateLimitLimit
        type: integer
        description: Requests the token may make per minute, from the ratelimit-limit header
      - name: rateLimitRemaining
        type: integer
        display: Rate limit left
        description: Requests the token has left this minute, from the ratelimit-remaining header

  getAirport:
    description: >-
      Read one airport by its arp_ ID (GET /air/airports/{id}, 200; an unknown ID is 404). Carries
      IATA and ICAO codes, the IATA code of its city, the country, coordinates, and the IANA time
      zone that departure and arrival times are local to.
    adapter: getAirport
    tags: [reference]
    inputs:
      - name: airportId
        type: string
        description: The airport's arp_ ID
        default:
          from: listAirports.airports
          select:
            strategy: first
            field: id
    outputs:
      - name: id
        type: string
      - name: iataCode
        type: string
        display: Airport
      - name: icaoCode
        type: string
        description: The ICAO code; "" when Duffel has none
      - name: name
        type: string
      - name: cityCode
        type: string
        description: The IATA code of the airport's city, such as LON for Heathrow; "" when it has none
      - name: countryCode
        type: string
      - name: timeZone
        type: string
      - name: latitude
        type: float
      - name: longitude
        type: float

  listCities:
    description: >-
      Page through the cities Duffel groups airports under (GET /air/cities, 200), with the same
      cursor pagination as listAirports. Each city lists its airports.
    adapter: listCities
    tags: [reference, pagination]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Cities per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: cities
        type: city[]
        elementFields:
          - name: id
            type: string
          - name: iataCode
            type: string
          - name: name
            type: string
          - name: countryCode
            type: string
          - name: airportCount
            type: integer
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getCity:
    description: >-
      Read one city by its cit_ ID (GET /air/cities/{id}, 200), with the airports that serve it.
    adapter: getCity
    tags: [reference]
    inputs:
      - name: cityId
        type: string
        description: The city's cit_ ID
        default:
          from: listCities.cities
          select:
            strategy: first
            field: id
    outputs:
      - name: id
        type: string
      - name: iataCode
        type: string
        display: City
      - name: name
        type: string
      - name: countryCode
        type: string
      - name: airportCodes
        type: string[]
        description: The IATA codes of the city's airports
      - name: airportCount
        type: integer

  listAirlines:
    description: >-
      Page through the airlines Duffel sells (GET /air/airlines, 200), with cursor pagination.
      Test mode's own airline, Duffel Airways, has IATA code ZZ.
    adapter: listAirlines
    tags: [reference, pagination]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Airlines per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: airlines
        type: airline[]
        elementFields:
          - name: id
            type: string
          - name: iataCode
            type: string
          - name: name
            type: string
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getAirline:
    description: >-
      Read one airline by its arl_ ID (GET /air/airlines/{id}, 200), with its logos and its
      conditions of carriage when Duffel has them.
    adapter: getAirline
    tags: [reference]
    inputs:
      - name: airlineId
        type: string
        description: The airline's arl_ ID
        default:
          from: listAirlines.airlines
          select:
            strategy: first
            field: id
    outputs:
      - name: id
        type: string
      - name: iataCode
        type: string
        description: The IATA code; "" when the airline has none
      - name: name
        type: string
        display: Airline
      - name: logoSymbolUrl
        type: string
        description: The square logo's URL; "" when Duffel has none
      - name: conditionsOfCarriageUrl
        type: string
        description: The airline's conditions of carriage; "" when Duffel has none

  listAircraft:
    description: >-
      Page through the aircraft types segments are flown on (GET /air/aircraft, 200), with cursor
      pagination.
    adapter: listAircraft
    tags: [reference, pagination]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Aircraft per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: aircraft
        type: aircraftType[]
        elementFields:
          - name: id
            type: string
          - name: iataCode
            type: string
          - name: name
            type: string
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getAircraft:
    description: >-
      Read one aircraft type by its arc_ ID (GET /air/aircraft/{id}, 200).
    adapter: getAircraft
    tags: [reference]
    inputs:
      - name: aircraftId
        type: string
        description: The aircraft type's arc_ ID
        default:
          from: listAircraft.aircraft
          select:
            strategy: first
            field: id
    outputs:
      - name: id
        type: string
      - name: iataCode
        type: string
      - name: name
        type: string
        display: Aircraft

  listLoyaltyProgrammes:
    description: >-
      Page through the airline loyalty programmes a passenger can book with (GET
      /air/loyalty_programmes, 200), with cursor pagination. Each names the airline that runs it.
    adapter: listLoyaltyProgrammes
    tags: [reference, pagination, loyalty]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Programmes per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: loyaltyProgrammes
        type: loyaltyProgramme[]
        elementFields:
          - name: id
            type: string
          - name: name
            type: string
          - name: ownerAirlineId
            type: string
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getLoyaltyProgramme:
    description: >-
      Read one loyalty programme by its loy_ ID (GET /air/loyalty_programmes/{id}, 200), with the
      arl_ ID of the airline that runs it and its alliance, if any.
    adapter: getLoyaltyProgramme
    tags: [reference, loyalty]
    inputs:
      - name: loyaltyProgrammeId
        type: string
        description: The programme's loy_ ID
        default:
          from: listLoyaltyProgrammes.loyaltyProgrammes
          select:
            strategy: first
            field: id
    outputs:
      - name: id
        type: string
      - name: name
        type: string
        display: Programme
      - name: ownerAirlineId
        type: string
        description: The arl_ ID of the airline that runs the programme
      - name: alliance
        type: string
        description: The alliance the programme belongs to; "" when none

  # --- Search and offers ----------------------------------------------------------------

  createOfferRequest:
    description: >-
      Search for flights (POST /air/offer_requests?return_offers=false, 201). The response has the offer
      request's orq_ ID, its passengers with their pas_ IDs, and the slices searched, but no offers:
      listOffers pages them, where return_offers=true would put every offer in this response (1.5 MB for
      229 offers from LHR to JFK). One slice is a one-way search; returnDate adds the way back, and
      stopover with onwardDate adds an open-jaw leg from destination to stopover instead. Passengers are
      given by age. live_mode is false for a test token. A supplier slower than supplierTimeout
      milliseconds is left out; Duffel's STN to LHR test route answers 504 gateway_timeout_error.
    adapter: createOfferRequest
    tags: [search, offers]
    inputs:
      - name: origin
        type: string
        default: LHR
        description: IATA code of the airport or city to fly from
      - name: destination
        type: string
        default: JFK
        description: IATA code of the airport or city to fly to
      - name: departureDate
        type: date
        default: "{{today + 30 days}}"
        description: The outbound departure date
      - name: returnDate
        type: date
        optional: true
        description: Adds a slice back from destination to origin on this date
      - name: stopover
        type: string
        optional: true
        description: Adds an open-jaw slice from destination to this airport, departing onwardDate
      - name: onwardDate
        type: date
        optional: true
        description: The departure date of the open-jaw slice; send with stopover
      - name: passengerAges
        type: integer[]
        default:
          value: [35]
        description: One age per passenger; 18 and over flies as an adult, under 2 as an infant
      - name: cabinClass
        type: enum[economy, premium_economy, business, first]
        default: economy
      - name: maxConnections
        type: integer
        optional: true
        description: The most connections a slice may have; 0 for direct flights only
      - name: supplierTimeout
        type: integer
        default: 20000
        description: Milliseconds to wait for each supplier, 2000 to 60000
    outputs:
      - name: offerRequestId
        type: string
        display: Offer request
      - name: liveMode
        type: boolean
        description: false for a test token; plans assert it before anything is booked
      - name: cabinClass
        type: string
      - name: sliceCount
        type: integer
      - name: passengerCount
        type: integer
      - name: passengers
        type: searchPassenger[]
        description: The passengers searched for, with the pas_ IDs an order names
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: age
            type: integer
    satisfies: [offersRequested]

  listOffers:
    description: >-
      Page through an offer request's offers (GET /air/offers, 200), cheapest first with
      sort=total_amount; maxConnections 0 keeps direct flights only. Every offer prices all the
      passengers searched for and is owned by the airline that sells it. In test mode only Duffel
      Airways, owner ZZ, books reliably, so plans take the offer whose ownerCode is ZZ. A route with no
      flights, such as the PVD to RAI test route, gives an empty page.
    adapter: listOffers
    tags: [search, offers, pagination]
    inputs:
      - name: offerRequestId
        type: string
        default:
          from: createOfferRequest.offerRequestId
      - name: sort
        type: enum[total_amount, total_duration]
        default: total_amount
      - name: limit
        type: integer
        default: 50
        description: Offers per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: maxConnections
        type: integer
        optional: true
        description: The most connections a slice may have; 0 for direct flights only
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: offers
        type: offer[]
        elementFields:
          - name: id
            type: string
          - name: ownerCode
            type: string
          - name: totalAmount
            type: string
          - name: totalCurrency
            type: string
          - name: requiresInstantPayment
            type: boolean
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page
      - name: zzOfferCount
        type: integer
        description: How many offers on this page Duffel Airways owns
      - name: instantPaymentCount
        type: integer
        description: How many offers on this page must be paid as they are booked, rather than held
      - name: cheapestTotalAmount
        type: string
        display: Cheapest
        description: The first offer's total; the cheapest when sorted by total_amount; "" on an empty page
    satisfies: [offersListed]

  getOfferRequest:
    description: >-
      Read an offer request (GET /air/offer_requests/{id}, 200). It inlines every offer the search
      produced, so the response is as large as return_offers=true would have made the search's;
      listOffers pages them instead.
    adapter: getOfferRequest
    tags: [search, offers]
    inputs:
      - name: offerRequestId
        type: string
        default:
          from: createOfferRequest.offerRequestId
    outputs:
      - name: offerRequestId
        type: string
      - name: cabinClass
        type: string
      - name: sliceCount
        type: integer
      - name: passengerCount
        type: integer
      - name: offerCount
        type: integer

  listOfferRequests:
    description: >-
      Page through the account's offer requests (GET /air/offer_requests, 200), with cursor pagination.
      Entries carry no offers.
    adapter: listOfferRequests
    tags: [search, pagination]
    inputs:
      - name: limit
        type: integer
        default: 50
        description: Offer requests per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
    outputs:
      - name: offerRequests
        type: offerRequest[]
        elementFields:
          - name: id
            type: string
          - name: cabinClass
            type: string
          - name: createdAt
            type: string
      - name: pageSize
        type: integer
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getOffer:
    description: >-
      Read one offer at its latest price, with the extra services it sells (GET
      /air/offers/{id}?return_available_services=true, 200). An offer expires about 30 minutes after the
      search; a stale one, as on the LGW to LHR test route, is 422 offer_no_longer_available. The price
      can move after the search: on the LHR to STN test route every read costs 10.00 more. A Duffel
      Airways offer can always be held, with payment due about three days later, and sells one extra 23 kg
      checked bag per passenger and segment. Whether it allows a change or a refund varies from search to
      search; an allowed one states its penalty.
    adapter: getOffer
    tags: [offers]
    inputs:
      - name: offerId
        type: string
        default:
          from: listOffers.offers
          select:
            strategy: match
            field: id
            filter: ownerCode == "ZZ"
    outputs:
      - name: offerId
        type: string
      - name: ownerCode
        type: string
        display: Airline
      - name: liveMode
        type: boolean
      - name: totalAmount
        type: string
        display: Total
        description: What the offer costs for every passenger, as a decimal string
      - name: totalCurrency
        type: string
      - name: baseAmount
        type: string
      - name: taxAmount
        type: string
      - name: expiresAt
        type: string
      - name: requiresInstantPayment
        type: boolean
        description: true when the offer can't be held and must be paid as it's booked
      - name: paymentRequiredBy
        type: string
        description: When a held order of this offer must be paid; "" when it can't be held
      - name: fareBrand
        type: string
        description: The first slice's fare brand, such as Basic; "" when the airline names none
      - name: changeAllowed
        type: boolean
      - name: changePenalty
        type: string
        description: The penalty for a change before departure; "" when none is stated
      - name: refundAllowed
        type: boolean
      - name: refundPenalty
        type: string
        description: The penalty for a refund before departure; "" when none is stated
      - name: sliceCount
        type: integer
      - name: firstSliceSegmentCount
        type: integer
        description: Flights in the first slice; 2 or more means a connection
      - name: firstSegmentStopCount
        type: integer
        description: Stops within the first flight, where the aircraft lands without a change of flight number
      - name: firstSegmentBaggageCount
        type: integer
        description: Kinds of baggage included for the first passenger on the first flight
      - name: passengers
        type: offerPassenger[]
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: age
            type: integer
          - name: loyaltyAccountCount
            type: integer
      - name: services
        type: service[]
        description: The extra services the offer sells, each for one passenger on one segment
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: amount
            type: string
          - name: currency
            type: string
          - name: maxQuantity
            type: integer
          - name: bagType
            type: string
          - name: maxWeightKg
            type: integer
          - name: passengerId
            type: string
          - name: segmentId
            type: string
      - name: serviceCount
        type: integer
      - name: checkedBagServiceId
        type: string
        description: The first extra checked bag for sale; "" when the offer sells none
      - name: checkedBagAmount
        type: string
        description: That bag's price; "" when the offer sells none
      - name: totalAmountCents
        type: integer
        description: totalAmount in cents, to compare prices as whole numbers
      - name: bookingPassengers
        type: bookingPassenger[]
        description: >-
          The passengers as createOrder names them, each with a title, gender, names, and a birth date that
          fits the age searched; adults who carry an infant are in infantCarers instead
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: age
            type: integer
          - name: title
            type: string
          - name: gender
            type: string
          - name: givenName
            type: string
          - name: familyName
            type: string
          - name: bornOn
            type: string
      - name: infantCarers
        type: bookingPassenger[]
        optional: true
        description: Adults who carry an infant, each with the infant's pas_ ID as infantPassengerId; absent without infants
        elementFields:
          - name: id
            type: string
          - name: type
            type: string
          - name: age
            type: integer
          - name: title
            type: string
          - name: gender
            type: string
          - name: givenName
            type: string
          - name: familyName
            type: string
          - name: bornOn
            type: string
          - name: infantPassengerId
            type: string
    satisfies: [offerSelected]

  priceOffer:
    description: >-
      Price an offer with the services and payment method an order will use (POST
      /air/offers/{id}/actions/price, 200). The response is the offer at that price; an instant order
      pays exactly its total_amount. A balance payment adds no surcharge. On the LHR to STN test route
      each call raises the price again.
    adapter: priceOffer
    tags: [offers, pricing]
    inputs:
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
      - name: services
        type: serviceSelection[]
        optional: true
        description: Services the order will buy, as a list of {id, quantity}
      - name: seatServices
        type: serviceSelection[]
        optional: true
        description: Seats the order will buy, each {id}, as getSeatMaps picks them
      - name: bagServices
        type: serviceSelection[]
        optional: true
        description: Checked bags the order will buy, each {id}, as getOfferBags lists them
    outputs:
      - name: offerId
        type: string
      - name: totalAmount
        type: string
        display: Priced total
      - name: totalCurrency
        type: string
      - name: intendedServiceCount
        type: integer
      - name: intendedServices
        type: serviceSelection[]
        description: The services priced, each {id, quantity}, which createOrder books as they are
        elementFields:
          - name: id
            type: string
          - name: quantity
            type: integer

  listUpsellOffers:
    description: >-
      Ask for the same journey in higher fare brands (POST /air/offers/{id}/upsell_offers). Duffel Airways
      sells no upsells: the answer is 422 unsupported_action, an airline_error, and the JS client's
      /upsell path answers the same.
    adapter: listUpsellOffers
    tags: [offers]
    inputs:
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
    outputs:
      - name: upsellOfferCount
        type: integer
        optional: true
        description: How many upsell offers came back, from an airline that sells them

  updateOfferPassenger:
    description: >-
      Name an offer's passenger and attach loyalty programme accounts before booking (PATCH
      /air/offers/{offer_id}/passengers/{id}, 200). Read the offer again for its new price: Duffel's test
      loyalty account (Amelia Earhart, ZZ, 1234567890) takes 10% off a Duffel Airways offer.
    adapter: updateOfferPassenger
    tags: [offers, loyalty]
    inputs:
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
      - name: passengerId
        type: string
        default:
          from: getOffer.passengers
          select:
            strategy: first
            field: id
      - name: givenName
        type: string
        default: Amelia
      - name: familyName
        type: string
        default: Earhart
      - name: loyaltyAirline
        type: string
        default: ZZ
        description: IATA code of the airline whose programme the account belongs to
      - name: loyaltyAccountNumber
        type: string
        optional: true
        description: The loyalty account to attach; leave out to set only the name
    outputs:
      - name: passengerId
        type: string
      - name: givenName
        type: string
      - name: familyName
        type: string
      - name: loyaltyAccountCount
        type: integer
      - name: loyaltyAccountNumber
        type: string
        description: The first attached account; "" when none is attached

  getSeatMaps:
    description: >-
      Read an offer's seat maps (GET /air/seat_maps?offer_id=, 200): one map per segment, each with
      cabins of rows, sections, and elements. A seat is for sale when its available_services price it for
      a passenger, and some seats carry disclosures, such as "Passenger must be an adult". The Duffel
      Airways economy cabin has 192 seats, 76 of them for sale at 20.00. Seats are bought only with the
      order.
    adapter: getSeatMaps
    tags: [offers, seats]
    inputs:
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
    outputs:
      - name: seatMapCount
        type: integer
      - name: seats
        type: seat[]
        description: One entry per seat for sale per passenger, across every map
        elementFields:
          - name: designator
            type: string
          - name: segmentId
            type: string
          - name: passengerId
            type: string
          - name: serviceId
            type: string
          - name: amount
            type: string
          - name: currency
            type: string
          - name: restricted
            type: boolean
      - name: availableSeatCount
        type: integer
        display: Seats for sale
      - name: restrictedSeatCount
        type: integer
        description: Seats for sale that carry a disclosure
      - name: seatServices
        type: seatPick[]
        optional: true
        description: >-
          The seats an order buys: for each passenger on each segment, the first seat for sale with no
          disclosure that no one else has; absent when there are none
        elementFields:
          - name: id
            type: string
          - name: designator
            type: string
          - name: passengerId
            type: string
          - name: segmentId
            type: string
          - name: amount
            type: string
      - name: seatablePairCount
        type: integer
        description: Passenger and segment pairs with any seat for sale

  createBatchOfferRequest:
    description: >-
      Start a search whose offers arrive in batches (POST /air/batch_offer_requests, 201), to show results
      as each supplier answers. The response has the ID, total_batches, and remaining_batches, and no
      offers. Read the batches with getBatchOfferRequest within a minute, after which the search expires.
    adapter: createBatchOfferRequest
    tags: [search, offers, polling]
    inputs:
      - name: origin
        type: string
        default: LHR
      - name: destination
        type: string
        default: JFK
      - name: departureDate
        type: date
        default: "{{today + 30 days}}"
      - name: returnDate
        type: date
        optional: true
      - name: passengerAges
        type: integer[]
        default:
          value: [35]
      - name: cabinClass
        type: enum[economy, premium_economy, business, first]
        default: economy
    outputs:
      - name: batchOfferRequestId
        type: string
        display: Batch search
      - name: liveMode
        type: boolean
      - name: totalBatches
        type: integer
      - name: remainingBatches
        type: integer

  getBatchOfferRequest:
    description: >-
      Read the batches of a batch search that have arrived since the last read (GET
      /air/batch_offer_requests/{id}, 200). Each read returns only the new batches' offers, and
      remaining_batches counts what is still to come, so repeat it until remaining_batches is 0,
      collecting the offers. Batches come per supplier, so the count falls unevenly (6, 2, 1, 0 in one
      run), and Duffel Airways arrives in the first.
    adapter: getBatchOfferRequest
    tags: [search, offers, polling]
    inputs:
      - name: batchOfferRequestId
        type: string
        default:
          from: createBatchOfferRequest.batchOfferRequestId
    outputs:
      - name: remainingBatches
        type: integer
      - name: totalBatches
        type: integer
      - name: offerCount
        type: integer
        description: Offers in this read's batches
      - name: zzOffers
        type: offer[]
        description: The Duffel Airways offers in this read's batches
        elementFields:
          - name: id
            type: string
          - name: ownerCode
            type: string
          - name: totalAmount
            type: string
          - name: totalCurrency
            type: string
      - name: zzOfferCount
        type: integer

  # --- Orders -------------------------------------------------------------------------------

  listOrders:
    description: >-
      Page through the account's orders (GET /air/orders, 200) with cursor pagination: limit is 1 to
      200, and after takes the previous page's meta.after. Filters narrow the list to the orders booked
      from an offer, a booking reference, a customer user's orders, or orders by payment state. Orders
      this package books carry metadata.source "aat-duffel", and each page counts those, the ones of
      them still active (not cancelled), and active orders from anywhere else, apart.
    adapter: listOrders
    tags: [orders, pagination]
    inputs:
      - name: limit
        type: integer
        default: 200
        description: Orders per page, 1 to 200
        constraints:
          min: 1
          max: 200
      - name: after
        type: string
        optional: true
        description: The cursor from the previous page's nextCursor
      - name: offerId
        type: string
        optional: true
        description: Only the orders booked from this offer
      - name: bookingReference
        type: string
        optional: true
        description: Only the order with this booking reference
      - name: userId
        type: string
        optional: true
        description: Only the orders a customer user (icu_) is attached to
      - name: awaitingPayment
        type: boolean
        optional: true
        description: true for orders still awaiting payment, false for the rest
    outputs:
      - name: orderCount
        type: integer
        display: Orders read
      - name: ourOrderCount
        type: integer
        description: Orders on the page this package booked (metadata.source is aat-duffel)
      - name: ourActiveOrderCount
        type: integer
        display: Ours still active
        description: Of the package's orders, those not cancelled
      - name: ourActiveOrders
        type: activeOrder[]
        optional: true
        description: The package's orders that are still active, when there are any
        elementFields:
          - name: id
            type: string
          - name: bookingReference
            type: string
          - name: createdAt
            type: string
      - name: otherActiveOrderCount
        type: integer
        display: Other active orders
        description: Active orders this package didn't book, such as those earlier projects left
      - name: liveModeOrderCount
        type: integer
        description: Orders booked in live mode; 0 on a test-mode account
      - name: nextCursor
        type: string
        description: The cursor for the next page; "" on the last page

  getOfferBags:
    description: >-
      Read an offer's extra checked bags (GET /air/offers/{id}?return_available_services=true, 200), one
      service per passenger and segment. A step of its own names the bags an order buys, so getOffer's
      outputs don't wire bags into every order.
    adapter: getOfferBags
    tags: [offers, bags]
    inputs:
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
    outputs:
      - name: bagServices
        type: bagService[]
        elementFields:
          - name: id
            type: string
          - name: passengerId
            type: string
          - name: segmentId
            type: string
          - name: amount
            type: string
      - name: bagServiceCount
        type: integer

  createOrder:
    description: >-
      Book an offer (POST /air/orders, 201). An instant order pays from the balance, with amount and
      currency exactly the priced total, services included; a hold order sends no payment and is paid
      later with createPayment. Each passenger is named with the offer's pas_ ID, a title, gender, names,
      and a birth date that fits the age searched, and an adult who carries an infant names that infant.
      Every order carries metadata.source "aat-duffel". Its cleanup cancels the order.
    adapter: createOrder
    tags: [orders, booking]
    inputs:
      - name: orderType
        type: enum[instant, hold]
        default: instant
      - name: offerId
        type: string
        default:
          from: getOffer.offerId
      - name: bookingPassengers
        type: bookingPassenger[]
        default:
          from: getOffer.bookingPassengers
      - name: infantCarers
        type: bookingPassenger[]
        optional: true
        description: Adults who carry an infant, from getOffer.infantCarers
      - name: services
        type: serviceSelection[]
        optional: true
        description: Services to buy, as priceOffer.intendedServices lists them
      - name: amount
        type: string
        optional: true
        description: The payment, exactly the priced total; leave it out for a hold order
      - name: currency
        type: string
        optional: true
      - name: email
        type: string
        default: "{{env.contactEmail}}"
      - name: phoneNumber
        type: string
        default: "{{env.contactPhone}}"
      - name: userId
        type: string
        optional: true
        description: A customer user (icu_) to attach to the order
      - name: reference
        type: string
        optional: true
        description: A reference stored in the order's metadata next to its source
    outputs:
      - name: orderId
        type: string
      - name: bookingReference
        type: string
        display: Booking
      - name: liveMode
        type: boolean
      - name: orderType
        type: string
      - name: totalAmount
        type: string
        display: Order total
      - name: totalCurrency
        type: string
      - name: totalAmountCents
        type: integer
      - name: awaitingPayment
        type: boolean
      - name: paymentRequiredBy
        type: string
      - name: priceGuaranteeExpiresAt
        type: string
      - name: paidAt
        type: string
      - name: cancelledAt
        type: string
      - name: availableActions
        type: string
        description: The actions the order allows, sorted and joined by commas, such as cancel,change,update
      - name: cancellable
        type: boolean
      - name: passengerCount
        type: integer
      - name: adultCount
        type: integer
      - name: childCount
        type: integer
      - name: infantCount
        type: integer
      - name: loyaltyAccountCount
        type: integer
      - name: sliceCount
        type: integer
      - name: slices
        type: orderSlice[]
        elementFields:
          - name: id
            type: string
          - name: origin
            type: string
          - name: destination
            type: string
          - name: departureDate
            type: string
          - name: cabinClass
            type: string
      - name: firstSliceId
        type: string
      - name: serviceCount
        type: integer
      - name: seatCount
        type: integer
      - name: bagCount
        type: integer
      - name: metadataSource
        type: string
      - name: metadataReference
        type: string
      - name: userCount
        type: integer
      - name: firstSliceCabin
        type: string
      - name: firstSliceDepartureDate
        type: string
      - name: firstSliceDepartureTime
        type: string
        description: The first slice's departure time, HH:MM local to its airport
      - name: changeCount
        type: integer
      - name: confirmedChangeCount
        type: integer
      - name: lastChangeTotalAmount
        type: string
      - name: refundAmount
        type: string
      - name: refundTo
        type: string
      - name: airlineInitiatedChangeCount
        type: integer
      - name: firstSliceOrigin
        type: string
      - name: firstSliceDestination
        type: string
      - name: seatsPerSlice
        type: string
      - name: bagsPerSlice
        type: string
      - name: totalBeforeChanges
        type: string
    cleanup:
      node: createOrderCancellation
      when: cancellable == true

  getOrder:
    description: >-
      Read an order (GET /air/orders/{id}, 200): its payment state, the actions it allows, its passengers
      by type, slices with their cabin, services, and metadata.
    adapter: getOrder
    tags: [orders]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: orderId
        type: string
      - name: bookingReference
        type: string
        display: Booking
      - name: liveMode
        type: boolean
      - name: orderType
        type: string
      - name: totalAmount
        type: string
        display: Order total
      - name: totalCurrency
        type: string
      - name: totalAmountCents
        type: integer
      - name: awaitingPayment
        type: boolean
      - name: paymentRequiredBy
        type: string
      - name: priceGuaranteeExpiresAt
        type: string
      - name: paidAt
        type: string
      - name: cancelledAt
        type: string
      - name: availableActions
        type: string
        description: The actions the order allows, sorted and joined by commas, such as cancel,change,update
      - name: cancellable
        type: boolean
      - name: passengerCount
        type: integer
      - name: adultCount
        type: integer
      - name: childCount
        type: integer
      - name: infantCount
        type: integer
      - name: loyaltyAccountCount
        type: integer
      - name: sliceCount
        type: integer
      - name: slices
        type: orderSlice[]
        elementFields:
          - name: id
            type: string
          - name: origin
            type: string
          - name: destination
            type: string
          - name: departureDate
            type: string
          - name: cabinClass
            type: string
      - name: firstSliceId
        type: string
      - name: serviceCount
        type: integer
      - name: seatCount
        type: integer
      - name: bagCount
        type: integer
      - name: metadataSource
        type: string
      - name: metadataReference
        type: string
      - name: userCount
        type: integer
      - name: firstSliceCabin
        type: string
      - name: firstSliceDepartureDate
        type: string
      - name: firstSliceDepartureTime
        type: string
        description: The first slice's departure time, HH:MM local to its airport
      - name: changeCount
        type: integer
      - name: confirmedChangeCount
        type: integer
      - name: lastChangeTotalAmount
        type: string
        description: What the latest confirmed change cost; "" before any
      - name: refundAmount
        type: string
        description: The refund of a confirmed cancellation; "" when the order isn't cancelled
      - name: refundTo
        type: string
      - name: airlineInitiatedChangeCount
        type: integer
      - name: firstSliceOrigin
        type: string
      - name: firstSliceDestination
        type: string
      - name: seatsPerSlice
        type: string
        description: Seat services on each slice, in slice order, such as "2,2"
      - name: bagsPerSlice
        type: string
        description: Extra bag services on each slice, in slice order, such as "1,0"
      - name: totalBeforeChanges
        type: string
        description: The total less every confirmed change's change_total_amount

  updateOrder:
    description: >-
      Replace an order's metadata (PATCH /air/orders/{id}, 200), the only thing it updates. The request
      sends the source tag again with the new reference.
    adapter: updateOrder
    tags: [orders]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
      - name: reference
        type: string
    outputs:
      - name: orderId
        type: string
      - name: metadataSource
        type: string
      - name: metadataReference
        type: string

  createOrderCancellation:
    description: >-
      Quote an order's cancellation (POST /air/order_cancellations, 201): the refund, where it goes, and
      when the quote expires. Nothing is cancelled until confirmOrderCancellation, which cleanup runs next.
    adapter: createOrderCancellation
    tags: [orders, cancellations]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: orderCancellationId
        type: string
      - name: refundAmount
        type: string
        display: Refund
      - name: refundCurrency
        type: string
      - name: refundTo
        type: string
      - name: expiresAt
        type: string
      - name: airlineCreditCount
        type: integer
    cleanup: confirmOrderCancellation

  confirmOrderCancellation:
    description: >-
      Confirm a cancellation quote (POST /air/order_cancellations/{id}/actions/confirm, 200), which
      cancels the order and refunds it.
    adapter: confirmOrderCancellation
    tags: [orders, cancellations]
    inputs:
      - name: orderCancellationId
        type: string
        default:
          from: createOrderCancellation.orderCancellationId
    outputs:
      - name: orderCancellationId
        type: string
      - name: confirmedAt
        type: string
      - name: refundAmount
        type: string
      - name: refundTo
        type: string

  createPayment:
    description: >-
      Pay a held order (POST /air/payments, 201), from the balance or with an airline credit, with amount
      and currency exactly the order's total.
    adapter: createPayment
    tags: [orders, payments]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
      - name: amount
        type: string
      - name: currency
        type: string
      - name: paymentType
        type: enum[balance, airline_credit]
        default: balance
      - name: airlineCreditId
        type: string
        optional: true
        description: The credit a payment of type airline_credit spends
    outputs:
      - name: paymentId
        type: string
      - name: amount
        type: string
        display: Paid
      - name: currency
        type: string
      - name: paymentType
        type: string
      - name: paymentStatus
        type: string

  listPayments:
    description: List an order's payments (GET /air/payments?order_id=, 200).
    adapter: listPayments
    tags: [orders, payments]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: paymentCount
        type: integer
      - name: payments
        type: payment[]
        elementFields:
          - name: id
            type: string
          - name: amount
            type: string
          - name: currency
            type: string
          - name: type
            type: string
          - name: status
            type: string

  getPayment:
    description: Read one payment by its ID (GET /air/payments/{id}, 200).
    adapter: getPayment
    tags: [orders, payments]
    inputs:
      - name: paymentId
        type: string
        default:
          from: createPayment.paymentId
    outputs:
      - name: paymentId
        type: string
      - name: amount
        type: string
      - name: currency
        type: string
      - name: paymentType
        type: string
      - name: paymentStatus
        type: string

  # --- Changes, cancellations, and services after booking ---------------------------------

  createOrderChangeRequest:
    description: >-
      Ask what it costs to replace an order's slice with another (POST /air/order_change_requests, 201).
      The request removes one slice and adds a journey on a new date in a requested cabin, and answers
      with change offers, each with its added flight, what it costs, and the order's new total.
    adapter: createOrderChangeRequest
    tags: [orders, changes]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
      - name: sliceId
        type: string
        default:
          from: createOrder.firstSliceId
      - name: origin
        type: string
      - name: destination
        type: string
      - name: departureDate
        type: date
        default: "{{today + 37 days}}"
      - name: cabinClass
        type: enum[economy, premium_economy, business, first]
        default: economy
    outputs:
      - name: orderChangeRequestId
        type: string
      - name: changeOfferCount
        type: integer
        display: Change offers
      - name: changeOffers
        type: changeOffer[]
        elementFields:
          - name: id
            type: string
          - name: cabinClass
            type: string
          - name: departureTime
            type: string
          - name: departureDate
            type: string
          - name: changeTotalAmount
            type: string
          - name: penaltyTotalAmount
            type: string
          - name: newTotalAmount
            type: string
      - name: cabins
        type: string
        description: The distinct cabins offered, sorted and joined by commas
      - name: departureTimes
        type: string
        description: The distinct departure times offered, sorted and joined by commas
      - name: changeTotals
        type: string
        description: The distinct change totals, sorted and joined by commas
      - name: businessOfferCount
        type: integer

  getOrderChangeRequest:
    description: Read an order change request with its change offers (GET /air/order_change_requests/{id}, 200).
    adapter: getOrderChangeRequest
    tags: [orders, changes]
    inputs:
      - name: orderChangeRequestId
        type: string
        default:
          from: createOrderChangeRequest.orderChangeRequestId
    outputs:
      - name: orderChangeRequestId
        type: string
      - name: changeOfferCount
        type: integer
      - name: changeOffers
        type: changeOffer[]
        elementFields:
          - name: id
            type: string
          - name: cabinClass
            type: string
          - name: departureTime
            type: string
          - name: departureDate
            type: string
          - name: changeTotalAmount
            type: string
          - name: penaltyTotalAmount
            type: string
          - name: newTotalAmount
            type: string
      - name: cabins
        type: string
      - name: departureTimes
        type: string
      - name: changeTotals
        type: string
      - name: businessOfferCount
        type: integer

  listOrderChangeOffers:
    description: >-
      Page through a change request's offers, cheapest change first (GET
      /air/order_change_offers?order_change_request_id=, 200), with cursor pagination.
    adapter: listOrderChangeOffers
    tags: [orders, changes, pagination]
    inputs:
      - name: orderChangeRequestId
        type: string
        default:
          from: createOrderChangeRequest.orderChangeRequestId
      - name: after
        type: string
        optional: true
    outputs:
      - name: changeOfferCount
        type: integer
      - name: changeOffers
        type: changeOffer[]
        elementFields:
          - name: id
            type: string
          - name: cabinClass
            type: string
          - name: departureTime
            type: string
          - name: departureDate
            type: string
          - name: changeTotalAmount
            type: string
          - name: penaltyTotalAmount
            type: string
          - name: newTotalAmount
            type: string
      - name: cabins
        type: string
      - name: departureTimes
        type: string
      - name: changeTotals
        type: string
      - name: businessOfferCount
        type: integer
      - name: nextCursor
        type: string

  getOrderChangeOffer:
    description: Read one change offer (GET /air/order_change_offers/{id}, 200) with the flight it adds and its cost.
    adapter: getOrderChangeOffer
    tags: [orders, changes]
    inputs:
      - name: orderChangeOfferId
        type: string
    outputs:
      - name: orderChangeOfferId
        type: string
      - name: changeTotalAmount
        type: string
      - name: changeTotalCurrency
        type: string
      - name: penaltyTotalAmount
        type: string
      - name: newTotalAmount
        type: string
      - name: cabinClass
        type: string
      - name: departureTime
        type: string
      - name: departureDate
        type: string

  createOrderChange:
    description: >-
      Choose a change offer (POST /air/order_changes, 201), which makes a pending change with its cost.
      Nothing changes on the order until confirmOrderChange.
    adapter: createOrderChange
    tags: [orders, changes]
    inputs:
      - name: orderChangeOfferId
        type: string
        default:
          from: getOrderChangeOffer.orderChangeOfferId
    outputs:
      - name: orderChangeId
        type: string
      - name: changeTotalAmount
        type: string
        display: Change cost
      - name: changeTotalCurrency
        type: string
      - name: penaltyTotalAmount
        type: string
      - name: newTotalAmount
        type: string
      - name: confirmedAt
        type: string
      - name: paymentAmount
        type: string
        optional: true
        description: The payment the confirmation sends; absent when the change costs nothing
      - name: addedCabinClass
        type: string
      - name: addedDepartureTime
        type: string

  getOrderChange:
    description: Read an order change (GET /air/order_changes/{id}, 200), pending or confirmed.
    adapter: getOrderChange
    tags: [orders, changes]
    inputs:
      - name: orderChangeId
        type: string
        default:
          from: createOrderChange.orderChangeId
    outputs:
      - name: orderChangeId
        type: string
      - name: changeTotalAmount
        type: string
      - name: confirmedAt
        type: string

  confirmOrderChange:
    description: >-
      Confirm a pending change (POST /air/order_changes/{id}/actions/confirm, 200), paying its cost from
      the balance when it has one.
    adapter: confirmOrderChange
    tags: [orders, changes]
    inputs:
      - name: orderChangeId
        type: string
        default:
          from: createOrderChange.orderChangeId
      - name: paymentAmount
        type: string
        optional: true
      - name: currency
        type: string
        optional: true
    outputs:
      - name: orderChangeId
        type: string
      - name: changeTotalAmount
        type: string
      - name: confirmedAt
        type: string

  getOrderCancellation:
    description: Read a cancellation, quoted or confirmed (GET /air/order_cancellations/{id}, 200).
    adapter: getOrderCancellation
    tags: [orders, cancellations]
    inputs:
      - name: orderCancellationId
        type: string
        default:
          from: createOrderCancellation.orderCancellationId
    outputs:
      - name: orderCancellationId
        type: string
      - name: refundAmount
        type: string
      - name: refundTo
        type: string
      - name: expiresAt
        type: string
      - name: confirmedAt
        type: string

  listOrderCancellations:
    description: List an order's cancellations (GET /air/order_cancellations?order_id=, 200).
    adapter: listOrderCancellations
    tags: [orders, cancellations]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: cancellationCount
        type: integer
      - name: confirmedCancellationCount
        type: integer

  listOrderAvailableServices:
    description: List the services a booked order can still add (GET /air/orders/{id}/available_services, 200).
    adapter: listOrderAvailableServices
    tags: [orders, services]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: serviceCount
        type: integer

  addOrderServices:
    description: >-
      Add a service to a booked order (POST /air/orders/{id}/services), paying for it from the balance
      when an amount is given; a held order takes no payment.
    adapter: addOrderServices
    tags: [orders, services]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
      - name: serviceId
        type: string
      - name: amount
        type: string
        optional: true
      - name: currency
        type: string
        optional: true
    outputs:
      - name: serviceCount
        type: integer
        optional: true

  # --- Disruptions: airline-initiated changes and airline credits ---------------------------

  listAirlineInitiatedChanges:
    description: List an order's airline-initiated changes (GET /air/airline_initiated_changes?order_id=, 200).
    adapter: listAirlineInitiatedChanges
    tags: [orders, disruptions]
    inputs:
      - name: orderId
        type: string
        default:
          from: createOrder.orderId
    outputs:
      - name: airlineInitiatedChangeCount
        type: integer
        display: Airline changes
      - name: latestAirlineInitiatedChangeId
        type: string
        description: The newest change, the only one that can be accepted; "" when there is none
      - name: latestActionTaken
        type: string
      - name: latestAvailableActions
        type: string
        description: The newest change's available actions, sorted and joined by commas

  acceptAirlineInitiatedChange:
    description: >-
      Accept an airline-initiated change (POST /air/airline_initiated_changes/{id}/actions/accept). Only
      the order's latest change can be accepted; an older one gets 422 stale_airline_initiated_change_accept.
    adapter: acceptAirlineInitiatedChange
    tags: [orders, disruptions]
    inputs:
      - name: airlineInitiatedChangeId
        type: string
        default:
          from: listAirlineInitiatedChanges.latestAirlineInitiatedChangeId
    outputs:
      - name: airlineInitiatedChangeId
        type: string
      - name: actionTaken
        type: string

  listAirlineCredits:
    description: List the account's airline credits (GET /air/airline_credits, 200), optionally a customer user's.
    adapter: listAirlineCredits
    tags: [disruptions, credits]
    inputs:
      - name: userId
        type: string
        optional: true
    outputs:
      - name: airlineCreditCount
        type: integer
      - name: firstAirlineCreditId
        type: string

  getAirlineCredit:
    description: Read an airline credit (GET /air/airline_credits/{id}, 200).
    adapter: getAirlineCredit
    tags: [disruptions, credits]
    inputs:
      - name: airlineCreditId
        type: string
    outputs:
      - name: airlineCreditId
        type: string
      - name: amount
        type: string
      - name: amountCurrency
        type: string
      - name: code
        type: string
      - name: spentAt
        type: string
      - name: invalidatedAt
        type: string
      - name: orderId
        type: string

  createAirlineCredit:
    description: Record an airline credit the account holds (POST /air/airline_credits).
    adapter: createAirlineCredit
    tags: [disruptions, credits]
    inputs:
      - name: airlineCode
        type: string
        default: ZZ
      - name: amount
        type: string
        default: "25.00"
      - name: currency
        type: string
        default: USD
      - name: code
        type: string
        default: "{{unixtime}}000"
        description: A 13-digit ticket number; Duffel refuses letters with 422 validation_format
      - name: issuedOn
        type: date
        default: "{{today}}"
      - name: expiresAt
        type: string
        default: "{{now + 365 days}}"
      - name: creditType
        type: enum[eticket, mco, emd]
        default: mco
      - name: givenName
        type: string
        default: Amelia
      - name: familyName
        type: string
        default: Earhart
    outputs:
      - name: airlineCreditId
        type: string
      - name: amount
        type: string
      - name: code
        type: string

workflows:
  - name: Find Offer
    description: Search, list the offers cheapest first, and read the Duffel Airways offer at its latest price
    template: workflows/find-offer.yaml
    selectionHint: Anything that starts from an offer, such as pricing, seats, services, loyalty, or a search-side test route

  - name: Price Offer
    kind: addon
    description: Price the offer for a balance payment
    after: [getOffer]
    template: workflows/addons/price-offer.yaml

  - name: Seat Map
    kind: addon
    description: Read the offer's seat maps and the seats for sale
    after: [getOffer]
    template: workflows/addons/seat-map.yaml

  - name: Loyalty Account
    kind: addon
    description: Attach Duffel's test loyalty account to the passenger and read the offer at its member price
    after: [getOffer]
    template: workflows/addons/loyalty-account.yaml

  - name: Upsell Refused
    kind: addon
    description: Ask for upsell offers, which Duffel Airways refuses with 422 unsupported_action
    after: [getOffer]
    template: workflows/addons/upsell-refused.yaml

  - name: Book Flight
    description: Search, pick the Duffel Airways offer, price what the order buys, and book it, paid at once or held
    template: workflows/book-flight.yaml
    slots:
      - name: payment
        options: [Pay Now, Hold, Hold Then Pay]
        default: Pay Now
    selectionHint: Booking an order for one to four passengers, with seats, bags, loyalty, or metadata

  - name: Pay Now
    kind: slot
    description: Book the offer and pay the priced total from the balance
    template: workflows/slots/pay-now.yaml

  - name: Hold
    kind: slot
    description: Hold the offer unpaid, to be paid by its deadline
    template: workflows/slots/hold.yaml

  - name: Hold Then Pay
    kind: slot
    description: Hold the offer, then pay it at the total it was held for
    template: workflows/slots/hold-then-pay.yaml

  - name: Seats
    kind: addon
    description: Pick a seat for each passenger on each flight, bought with the order
    after: [getOffer]
    template: workflows/addons/seats.yaml

  - name: Checked Bags
    kind: addon
    description: Buy an extra checked bag for each passenger on each flight, with the order
    after: [getOffer]
    template: workflows/addons/checked-bags.yaml

  - name: Update Metadata
    kind: addon
    description: Replace the order's metadata, then find the order by its booking reference
    after: [createPayment, createOrder]
    template: workflows/addons/update-metadata.yaml

  - name: Change Flight
    kind: addon
    description: >-
      Move the first flight a week later in premium economy at 18:00, confirm it, and check the order's
      cabin, time, and total; a second change is refused
    after: [createPayment, createOrder]
    template: workflows/addons/change-flight.yaml

  - name: Airline-Initiated Change
    kind: addon
    description: Read the change Duffel Airways makes on the LHR to LTN test route, accept it, and check the flight's new time
    after: [createPayment, createOrder]
    template: workflows/addons/airline-initiated-change.yaml

  - name: Cancel Order
    kind: addon
    description: >-
      Quote the cancellation, confirm it, and check the refund on the cancelled order; a second quote and
      a second confirmation are refused
    after: [createPayment, createOrder]
    priority: 10
    template: workflows/addons/cancel-order.yaml
