# A checked bag added to an order after it was booked and paid. Duffel Airways lists no services for a
# booked order and refuses the bag with 400 "Unsupported operation", even though the offer sold the same
# bag. The order is left as booked, and cleanup cancels it.
metadata:
  prompt: Book a flight, then try to add a checked bag to the order
  graphVersion: "1.0.0"
intent:
  goal: addBag
  description: A bag added to a paid order is refused

execution:
  steps:
    - id: search
      node: createOfferRequest
      values:
        passengerAges: [35]
      assertions:
        mechanical:
          - type: predicate
            expr: liveMode == false

    - id: offers
      node: listOffers
      dependsOn: [search]
      values:
        offerRequestId: {from: search.offerRequestId}
        limit: 200
        maxConnections: 0
      assertions:
        mechanical:
          - type: predicate
            expr: zzOfferCount >= 1

    - id: offer
      node: getOffer
      dependsOn: [offers]
      values:
        offerId:
          from: offers.offers
          select:
            strategy: match
            field: id
            filter: ownerCode == "ZZ"

    - id: bags
      node: getOfferBags
      dependsOn: [offer]
      values:
        offerId: {from: offer.offerId}
      assertions:
        mechanical:
          - type: predicate
            expr: bagServiceCount >= 1

    - id: price
      node: priceOffer
      dependsOn: [bags]
      values:
        offerId: {from: offer.offerId}

    - id: book
      node: createOrder
      dependsOn: [price]
      values:
        orderType: instant
        offerId: {from: offer.offerId}
        bookingPassengers: {from: offer.bookingPassengers}
        amount: {from: price.totalAmount}
        currency: {from: price.totalCurrency}
      assertions:
        mechanical:
          - type: predicate
            expr: 'awaitingPayment == false && bagCount == 0 && metadataSource == "aat-duffel"'

    - id: available
      node: listOrderAvailableServices
      dependsOn: [book]
      values:
        orderId: {from: book.orderId}
      assertions:
        mechanical:
          - type: predicate
            expr: serviceCount == 0

    - id: addBag
      node: addOrderServices
      dependsOn: [available]
      isGoal: true
      values:
        orderId: {from: book.orderId}
        serviceId:
          from: bags.bagServices
          select:
            strategy: first
            field: id
        amount:
          from: bags.bagServices
          select:
            strategy: first
            field: amount
        currency: {from: price.totalCurrency}
      expectFailure:
        status: [400]
        description: Duffel Airways doesn't add services to a booked order
      assertions:
        mechanical:
          - type: fieldEquals
            path: errors.0.title
            value: Unsupported operation
            raw: true
          - type: fieldEquals
            path: errors.0.type
            value: invalid_request_error
            raw: true

  verification:
    - node: getOrder
      purpose: The order has no bag and its total is unchanged
      values:
        orderId: {from: book.orderId}
      assertions:
        mechanical:
          - type: predicate
            expr: 'bagCount == 0 && totalAmount == "{{book.totalAmount}}"'
