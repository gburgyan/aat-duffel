# Duffel's LHR to STN test route changes the offer's price between the search and the first read: the
# search lists one total, the offer read answers a higher one, and later reads keep it. (Until October
# 2026 the route raised the price on every read.) An order paid at the listed total is refused: 422
# payment_amount_does_not_match_order_amount, a validation_error. No order is created.
metadata:
  prompt: Book a stale price on Duffel's price change test route
  graphVersion: "1.0.0"
intent:
  goal: book
  description: The price rises after the search, and an order paid at the listed price is refused

execution:
  steps:
    - id: search
      node: createOfferRequest
      values:
        origin: LHR
        destination: STN
        passengerAges: [35]
      assertions:
        mechanical:
          - type: predicate
            expr: liveMode == false

    - id: offers
      node: listOffers
      dependsOn: [search]
      description: The Duffel Airways offer, at the total the search listed
      values:
        offerRequestId: {from: search.offerRequestId}
        limit: 200
      assertions:
        mechanical:
          - type: predicate
            expr: zzOfferCount >= 1

    - id: offer
      node: getOffer
      dependsOn: [offers]
      description: Read once, the offer already costs more than the search listed
      values:
        offerId:
          from: offers.offers
          select:
            strategy: match
            field: id
            filter: ownerCode == "ZZ"
      assertions:
        mechanical:
          # The route lists one offer, so the page's cheapest total is this offer's listed price.
          - type: predicate
            expr: 'totalAmount > "{{offers.cheapestTotalAmount}}"'

    - id: book
      node: createOrder
      dependsOn: [offer]
      isGoal: true
      description: Pay the listed total, which the order no longer costs
      selections:
        listed:
          from: offers.offers
          filter: ownerCode == "ZZ"
      values:
        orderType: instant
        offerId: {from: offer.offerId}
        bookingPassengers: {from: offer.bookingPassengers}
        amount: {fromSelection: listed.totalAmount}
        currency: {fromSelection: listed.totalCurrency}
      expectFailure:
        status: [422]
        description: The payment doesn't match the order's current total
      assertions:
        mechanical:
          - type: fieldEquals
            path: errors.0.code
            value: payment_amount_does_not_match_order_amount
            raw: true
          - type: fieldEquals
            path: errors.0.type
            value: validation_error
            raw: true

  verification:
    - node: listOrders
      purpose: No order was booked from the offer
      values:
        offerId: {from: offer.offerId}
      assertions:
        mechanical:
          - type: predicate
            expr: orderCount == 0
