adapter: createOfferRequest
protocol: http

request:
  method: POST
  path: /air/offer_requests?return_offers=false&supplier_timeout={{supplierTimeout}}
  headers:
    Content-Type: application/json
  body: |
    {
      "data": {
        "slices": [
          {"origin": "{{origin}}", "destination": "{{destination}}", "departure_date": "{{departureDate}}"}{{?returnDate}},
          {"origin": "{{destination}}", "destination": "{{origin}}", "departure_date": "{{returnDate}}"}{{/returnDate}}{{?stopover}},
          {"origin": "{{destination}}", "destination": "{{stopover}}", "departure_date": "{{onwardDate}}"}{{/stopover}}
        ],
        "passengers": [{{#passengerAges}}{"age": {{.}}}{{/passengerAges}}],
        "cabin_class": "{{cabinClass}}"{{?maxConnections}},
        "max_connections": {{maxConnections}}{{/maxConnections}}
      }
    }

response:
  extract:
    offerRequestId: data.id
    liveMode: data.live_mode
    cabinClass: data.cabin_class
    sliceCount: 'data.slices.#'
    passengerCount: 'data.passengers.#'
    firstSliceOrigin: data.slices.0.origin.iata_code
    firstSliceDestination: data.slices.0.destination.iata_code
    firstSliceDepartureDate: data.slices.0.departure_date
    secondSliceDepartureDate:
      path: data.slices.1.departure_date
      default: ""
    passengers:
      path: data.passengers
      fields:
        id: id
        type: type
        age: age
