adapter: getOrder
protocol: http

request:
  method: GET
  path: /air/orders/{{orderId}}

response:
  extract:
    orderId: data.id
    bookingReference: data.booking_reference
    liveMode: data.live_mode
    orderType:
      path: data.type
      default: ""
    totalAmount: data.total_amount
    totalCurrency: data.total_currency
    sliceCount: 'data.slices.#'
    passengerCount: 'data.passengers.#'
    firstSliceId: data.slices.0.id
    serviceCount:
      path: 'data.services.#'
      default: 0
    userCount:
      path: 'data.users.#'
      default: 0
  # The same transform as createOrder's: payment state, actions, passengers by type, slices with their
  # cabin, services by type, and metadata.
  transform: |
    local order = json_path("data") or {}
    local function text(v)
      if v == nil then return "" end
      return tostring(v)
    end
    local function cents(amount)
      local sign, whole, frac = string.match(amount or "", "^(%-?)(%d+)%.?(%d*)$")
      if not whole then return 0 end
      local value = tonumber(whole) * 100 + tonumber((frac .. "00"):sub(1, 2))
      if sign == "-" then value = -value end
      return value
    end
    outputs.totalAmountCents = cents(order.total_amount)

    local payment = order.payment_status or {}
    outputs.awaitingPayment = payment.awaiting_payment == true
    outputs.paymentRequiredBy = text(payment.payment_required_by)
    outputs.priceGuaranteeExpiresAt = text(payment.price_guarantee_expires_at)
    outputs.paidAt = text(payment.paid_at)
    outputs.cancelledAt = text(order.cancelled_at)

    local actions = {}
    for _, action in ipairs(order.available_actions or {}) do table.insert(actions, action) end
    table.sort(actions)
    outputs.availableActions = table.concat(actions, ",")
    outputs.cancellable = false
    for _, action in ipairs(actions) do
      if action == "cancel" then outputs.cancellable = true end
    end

    -- An order's passengers carry no type, so count them by age on the last slice's departure date,
    -- the date Duffel checks birth dates against.
    local orderSlices = order.slices or {}
    local lastSegment = ((orderSlices[#orderSlices] or {}).segments or {})[1] or {}
    local ty, tm, td = string.match(lastSegment.departing_at or "", "^(%d+)-(%d+)-(%d+)")
    local adults, children, infants, loyalty = 0, 0, 0, 0
    for _, passenger in ipairs(order.passengers or {}) do
      local by, bm, bd = string.match(passenger.born_on or "", "^(%d+)-(%d+)-(%d+)$")
      if ty and by then
        local age = tonumber(ty) - tonumber(by)
        if tonumber(tm) * 100 + tonumber(td) < tonumber(bm) * 100 + tonumber(bd) then age = age - 1 end
        if age < 2 then
          infants = infants + 1
        elseif age < 18 then
          children = children + 1
        else
          adults = adults + 1
        end
      end
      loyalty = loyalty + #(passenger.loyalty_programme_accounts or {})
    end
    outputs.adultCount, outputs.childCount, outputs.infantCount = adults, children, infants
    outputs.loyaltyAccountCount = loyalty

    local slices = {}
    for _, slice in ipairs(order.slices or {}) do
      local segment = (slice.segments or {})[1] or {}
      table.insert(slices, {
        id = slice.id,
        origin = (slice.origin or {}).iata_code or "",
        destination = (slice.destination or {}).iata_code or "",
        departureDate = string.sub(segment.departing_at or "", 1, 10),
        departureTime = string.sub(segment.departing_at or "", 12, 16),
        cabinClass = ((segment.passengers or {})[1] or {}).cabin_class or "",
      })
    end
    outputs.slices = slices
    local firstSlice = slices[1] or {}
    outputs.firstSliceCabin = firstSlice.cabinClass or ""
    outputs.firstSliceDepartureDate = firstSlice.departureDate or ""
    outputs.firstSliceDepartureTime = firstSlice.departureTime or ""
    outputs.firstSliceOrigin = firstSlice.origin or ""
    outputs.firstSliceDestination = firstSlice.destination or ""

    local seats, bags = 0, 0
    for _, service in ipairs(order.services or {}) do
      if service.type == "seat" then seats = seats + 1 end
      if service.type == "baggage" then bags = bags + 1 end
    end
    outputs.seatCount, outputs.bagCount = seats, bags

    -- Seat and bag services on each slice, in slice order, such as "2,2". A change drops the services on
    -- the slice it replaces.
    local sliceOfSegment, seatsBySlice, bagsBySlice = {}, {}, {}
    for index, slice in ipairs(orderSlices) do
      seatsBySlice[index], bagsBySlice[index] = 0, 0
      for _, segment in ipairs(slice.segments or {}) do sliceOfSegment[segment.id] = index end
    end
    for _, service in ipairs(order.services or {}) do
      local counted = {}
      for _, segmentId in ipairs(service.segment_ids or {}) do
        local index = sliceOfSegment[segmentId]
        if index and not counted[index] then
          counted[index] = true
          if service.type == "seat" then seatsBySlice[index] = seatsBySlice[index] + 1 end
          if service.type == "baggage" then bagsBySlice[index] = bagsBySlice[index] + 1 end
        end
      end
    end
    -- Strings before joining, so one slice gives "1" and not the number 1.
    for index = 1, #orderSlices do
      seatsBySlice[index], bagsBySlice[index] = tostring(seatsBySlice[index]), tostring(bagsBySlice[index])
    end
    outputs.seatsPerSlice = table.concat(seatsBySlice, ",")
    outputs.bagsPerSlice = table.concat(bagsBySlice, ",")

    local metadata = type(order.metadata) == "table" and order.metadata or {}
    outputs.metadataSource = text(metadata.source)
    outputs.metadataReference = text(metadata.reference)

    -- A confirmed change adds its whole change_total_amount to the order's total, so the total before any
    -- change is the total less every confirmed change.
    local changes = order.changes or {}
    local confirmed, lastChange, changedCents = 0, nil, 0
    for _, change in ipairs(changes) do
      if change.confirmed_at then
        confirmed = confirmed + 1
        changedCents = changedCents + cents(change.change_total_amount)
        if not lastChange or change.confirmed_at > lastChange.confirmed_at then lastChange = change end
      end
    end
    outputs.changeCount = #changes
    outputs.confirmedChangeCount = confirmed
    outputs.lastChangeTotalAmount = lastChange and text(lastChange.change_total_amount) or ""
    local before = cents(order.total_amount) - changedCents
    local fraction = before % 100
    outputs.totalBeforeChanges = tostring((before - fraction) / 100) .. "." .. (fraction < 10 and "0" or "") ..
      tostring(fraction)

    local cancellation = type(order.cancellation) == "table" and order.cancellation or {}
    outputs.refundAmount = text(cancellation.refund_amount)
    outputs.refundTo = text(cancellation.refund_to)
    outputs.airlineInitiatedChangeCount = #(order.airline_initiated_changes or {})
    return outputs
