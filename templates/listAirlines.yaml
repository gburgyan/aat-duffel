adapter: listAirlines
protocol: http

request:
  method: GET
  path: /air/airlines?limit={{limit}}{{?after}}&after={{after}}{{/after}}

response:
  extract:
    airlines:
      path: data
      fields:
        id: id
        iataCode: iata_code
        name: name
    pageSize: 'data.#'
    nextCursor:
      path: meta.after
      default: ""
