adapter: listCities
protocol: http

request:
  method: GET
  path: /air/cities?limit={{limit}}{{?after}}&after={{after}}{{/after}}

response:
  extract:
    cities:
      path: data
      fields:
        id: id
        iataCode: iata_code
        name: name
        countryCode: iata_country_code
        airportCount: 'airports.#'
    pageSize: 'data.#'
    nextCursor:
      path: meta.after
      default: ""
