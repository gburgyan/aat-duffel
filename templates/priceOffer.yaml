adapter: priceOffer
protocol: http

request:
  method: POST
  path: /air/offers/{{offerId}}/actions/price
  headers:
    Content-Type: application/json
  body: |
    {
      "data": {
        "intended_payment_methods": [{"type": "balance"}]{{?services|seatServices|bagServices}},
        "intended_services": [{{?services}}{{#services}}{"id": "{{.id}}", "quantity": {{.quantity}}}{{/services}}{{/services}}{{?seatServices}}{{?services}}, {{/services}}{{#seatServices}}{"id": "{{.id}}", "quantity": 1}{{/seatServices}}{{/seatServices}}{{?bagServices}}{{?services|seatServices}}, {{/services|seatServices}}{{#bagServices}}{"id": "{{.id}}", "quantity": 1}{{/bagServices}}{{/bagServices}}]{{/services|seatServices|bagServices}}
      }
    }

response:
  extract:
    offerId: data.id
    totalAmount: data.total_amount
    totalCurrency: data.total_currency
    intendedServiceCount:
      path: 'data.intended_services.#'
      default: 0
    intendedServices:
      path: data.intended_services
      default: []
      fields:
        id: id
        quantity: quantity
