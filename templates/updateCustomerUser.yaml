adapter: updateCustomerUser
protocol: http

request:
  method: PUT
  path: /identity/customer/users/{{customerUserId}}
  headers:
    Content-Type: application/json
  # PUT replaces the user, so email and both names are sent every time.
  body: |
    {"data": {"email": "{{email}}", "given_name": "{{givenName}}", "family_name": "{{familyName}}"{{?phoneNumber}}, "phone_number": "{{phoneNumber}}"{{/phoneNumber}}{{?groupId}}, "group_id": "{{groupId}}"{{/groupId}}}}

response:
  extract:
    customerUserId: data.id
    email: data.email
    givenName: data.given_name
    familyName: data.family_name
    phoneNumber:
      path: data.phone_number
      default: ""
    groupId:
      path: data.group.id
      default: ""
