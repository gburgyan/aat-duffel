adapter: updateCustomerUserGroup
protocol: http

request:
  method: PATCH
  path: /identity/customer/user_groups/{{customerUserGroupId}}
  headers:
    Content-Type: application/json
  body: |
    {"data": {"name": "{{name}}"{{?userId}}, "user_ids": ["{{userId}}"]{{/userId}}}}

response:
  extract:
    customerUserGroupId: data.id
    name: data.name
    userCount:
      path: 'data.user_ids.#'
      default: 0
