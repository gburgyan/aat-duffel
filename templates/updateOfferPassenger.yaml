adapter: updateOfferPassenger
protocol: http

request:
  method: PATCH
  path: /air/offers/{{offerId}}/passengers/{{passengerId}}
  headers:
    Content-Type: application/json
  body: |
    {
      "data": {
        "given_name": "{{givenName}}",
        "family_name": "{{familyName}}"{{?loyaltyAccountNumber}},
        "loyalty_programme_accounts": [{"airline_iata_code": "{{loyaltyAirline}}", "account_number": "{{loyaltyAccountNumber}}"}]{{/loyaltyAccountNumber}}
      }
    }

response:
  extract:
    passengerId: data.id
    givenName: data.given_name
    familyName: data.family_name
    loyaltyAccountCount: 'data.loyalty_programme_accounts.#'
    loyaltyAccountNumber:
      path: data.loyalty_programme_accounts.0.account_number
      default: ""
